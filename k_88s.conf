[mitm]
skip_validating_cert = true
hostname = app.uanalyze.com.tw, api.uanalyze.com.tw

[rewrite_local]
# 直接原生正則替換，完全不用掛載任何 .js 檔案
^https?:\/\/(app|api)\.uanalyze\.com\.tw url response-body ("free"\s*:\s*)0 response-body $11
^https?:\/\/(app|api)\.uanalyze\.com\.tw url response-body ("require_pay"\s*:\s*)1 response-body $10
^https?:\/\/(app|api)\.uanalyze\.com\.tw url response-body ("ua80211_cp"\s*:\s*)0 response-body $11
^https?:\/\/(app|api)\.uanalyze\.com\.tw url response-body ("ua120041_cp"\s*:\s*)"" response-body $180
